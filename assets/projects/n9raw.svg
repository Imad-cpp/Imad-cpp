<svg width="1280" height="370" viewBox="0 0 1280 370" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">N9raw project showcase</title>
  <desc id="desc">Static showcase for N9raw, a Moroccan student operating system being built by Imadeddine Es-sebaiy.</desc>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1280" y2="370" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A1210"/>
      <stop offset="1" stop-color="#10271E"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="370" rx="24" fill="url(#g)"/>
  <rect x="46" y="42" width="238" height="34" rx="17" fill="#15221D" stroke="#2A463A"/>
  <text x="69" y="65" fill="#62C08F" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="1.2">02 / CURRENTLY BUILDING</text>
  <text x="46" y="139" fill="#F4F7F5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="57" font-weight="800">N9raw</text>
  <text x="46" y="181" fill="#62C08F" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700">Moroccan Student Operating System</text>
  <text x="46" y="224" fill="#B8C4BE" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">Study · Orientation · Opportunities · Study abroad · First career</text>
  <text x="46" y="270" fill="#E4EAE7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">Next.js · TypeScript · Laravel · PostgreSQL · Redis · Meilisearch</text>
  <text x="46" y="322" fill="#80918A" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Search first. Verified information. Structured student journeys.</text>

  <g transform="translate(802 52)">
    <rect width="402" height="266" rx="22" fill="#F4F1E9"/>
    <text x="28" y="42" fill="#111915" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="1.1">STUDENT JOURNEY</text>
    <rect x="28" y="70" width="346" height="44" rx="12" fill="#E7ECE8"/>
    <text x="49" y="97" fill="#15221D" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700">01  Search by intent</text>
    <rect x="28" y="126" width="346" height="44" rx="12" fill="#E7ECE8"/>
    <text x="49" y="153" fill="#15221D" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700">02  Understand verified facts</text>
    <rect x="28" y="182" width="346" height="44" rx="12" fill="#E7ECE8"/>
    <text x="49" y="209" fill="#15221D" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700">03  Take the next useful action</text>
    <circle cx="354" cy="92" r="6" fill="#62C08F"/>
    <circle cx="354" cy="148" r="6" fill="#C9A84F"/>
    <circle cx="354" cy="204" r="6" fill="#62C08F"/>
