<svg width="1280" height="330" viewBox="0 0 1280 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Technology stack</title>
  <desc id="desc">Static technology matrix covering languages, frontend, backend, data and infrastructure.</desc>
  <rect width="1280" height="330" rx="24" fill="#0B1210"/>
  <text x="46" y="58" fill="#62C08F" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="1.2">05 / TECHNOLOGY</text>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="46" y="110" fill="#F3F6F4" font-size="18" font-weight="800">LANGUAGES</text>
    <text x="46" y="146" fill="#B6C1BC" font-size="17">TypeScript · PHP · Python · C++ · Java</text>
    <path d="M46 170H1234" stroke="#263931"/>

