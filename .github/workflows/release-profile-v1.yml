name: Release Profile v1.0.0

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository with write credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Finalize v1.0.0 baseline
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if git ls-remote --exit-code --tags origin refs/tags/v1.0.0 >/dev/null 2>&1; then
            echo "v1.0.0 already exists; no action required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm .github/workflows/release-profile-v1.yml
          git add .github/workflows/release-profile-v1.yml
          git commit -m "chore: finalize profile v1.0.0 baseline"
          git push origin HEAD:main

          git tag -a v1.0.0 -m "Profile v1.0.0 — IMAD-CPP / Engineering Signal"
          git push origin v1.0.0

          gh release create v1.0.0 \
            --title "Profile v1.0.0 — Engineering Signal" \
            --notes "First maintained public baseline of the Imad-cpp GitHub profile: responsive Engineering Signal identity, concise root README, verified profile pages, public-safe project case studies, source discipline and automated profile-quality checks."
