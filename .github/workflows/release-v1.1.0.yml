name: Release Profile v1.1.0

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-v1.1.0.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v1.1.0
      RELEASE_SHA: 38f735bf870ae475ac89c7b700a8cad73ecc1d1b
    steps:
      - name: Publish v1.1.0
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
            exit 0
          fi

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_SHA" \
            --title "Profile v1.1.0 — Engineering Signal Refinement" \
            --notes "Refines the maintained Engineering Signal profile with compact local visual cues, scan-first hierarchy across deep pages and case studies, stronger evidence boundaries, aligned public GitHub account metadata, and successful Profile Quality validation."
